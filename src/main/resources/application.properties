# Database URL - XAMPP එකේ අපි හදපු database එකේ නම (sabra_eats_db)
spring.datasource.url=jdbc:mysql://localhost:3306/sabra_eats
# XAMPP වල default username එක root
spring.datasource.username=root
# XAMPP වල default password එක හිස් (මුකුත් ලියන්න එපා)
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate settings (Java code එකෙන් database එක update කරන්න)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true