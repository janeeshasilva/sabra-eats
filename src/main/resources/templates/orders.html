<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SABRA Eats - My Orders</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark shadow-sm mb-4">
    <div class="container d-flex justify-content-between">
        <a th:href="@{/}" class="btn btn-outline-light fw-bold">⬅️ Back to Shops</a>
        <span class="navbar-brand mb-0 h1 fs-3 text-warning fw-bold">📦 My Orders</span>
        <a th:href="@{/cart}" class="btn btn-warning fw-bold">🛒 Go to Cart</a>
    </div>
</nav>

<div class="container">
    <div class="card shadow-sm mx-auto" style="max-width: 900px; border-radius: 15px;">
        <div class="card-body p-4">

            <h4 class="mb-4 text-dark fw-bold border-bottom pb-2">Order History</h4>

            <div th:if="${#lists.isEmpty(myOrders)}" class="text-center p-4">
                <h5 class="text-muted mb-3">You haven't placed any orders yet! 😕</h5>
                <a th:href="@{/}" class="btn btn-warning fw-bold text-dark">🍔 Order Now</a>
            </div>

            <div th:if="${!#lists.isEmpty(myOrders)}">
                <table class="table table-hover align-middle text-center">
                    <thead class="table-dark">
                    <tr>
                        <th>Order ID</th>
                        <th>Food Item</th>
                        <th>Price</th>
                        <th>Quantity</th>
                        <th>Total</th>
                        <th>Status</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="order : ${myOrders}">
                        <td class="fw-bold text-muted" th:text="'#' + ${order.order_id}">#1</td>
                        <td class="fw-bold text-primary" th:text="${order.itemName}">Item Name</td>
                        <td th:text="'Rs. ' + ${order.price}">Rs. 0.00</td>
                        <td th:text="${order.quantity}">1</td>
                        <td class="fw-bold" th:text="'Rs. ' + (${order.price * order.quantity})">Rs. 0.00</td>

                        <td>
                            <span th:if="${order.status == 'PENDING'}" class="badge bg-warning text-dark px-3 py-2">⏳ Pending</span>
                            <span th:if="${order.status == 'COMPLETED'}" class="badge bg-success px-3 py-2">✅ Completed</span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>
</div>

</body>
</html>
