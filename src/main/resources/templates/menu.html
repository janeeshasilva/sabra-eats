<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SABRA Eats - Menu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold text-warning" th:href="@{/}">🍔 SABRA Eats</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto align-items-center">
                <li class="nav-item">
                    <a class="nav-link text-white" th:href="@{/}">Home</a>
                </li>

                <th:block th:if="${session.loggedInUser == null}">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/login}">Login</a>
                    </li>
                    <li class="nav-item ms-2">
                        <a class="btn btn-warning btn-sm fw-bold text-dark" th:href="@{/register}">Sign Up</a>
                    </li>
                </th:block>

                <th:block th:if="${session.loggedInUser != null}">
                    <li class="nav-item me-3">
                        <a class="nav-link text-warning fw-bold" th:href="@{/cart}">🛒 My Cart</a>
                    </li>
                    <li class="nav-item">
                        <span class="nav-link text-light me-3 border-end pe-3">
                            Welcome, <strong class="text-warning" th:text="${session.loggedInUser.name}">User</strong>!
                        </span>
                    </li>
                    <li class="nav-item">
                        <a class="btn btn-outline-danger btn-sm fw-bold" th:href="@{/logout}">Logout</a>
                    </li>
                </th:block>
            </ul>
        </div>
    </div>
</nav>

<nav class="navbar navbar-dark bg-warning mb-4 shadow-sm">
    <div class="container d-flex justify-content-between">
        <a th:href="@{/}" class="btn btn-light text-warning fw-bold">⬅️ Back to Shops</a>
        <span class="navbar-brand mb-0 h1 fs-3 text-dark fw-bold">🍽️ Shop Menu</span>
        <a th:href="@{/cart}" class="btn btn-dark fw-bold">🛒 View Cart</a>
    </div>
</nav>

<div class="container text-center">

    <h1 class="text-dark fw-bold mb-1" th:text="${shop.shop_name} + ' 🍽️'">Shop Name</h1>
    <p class="text-muted fs-5 mb-4" th:text="'📍 Location: ' + ${shop.location}"></p>

    <div th:if="${session.loggedInUser != null and #strings.equalsIgnoreCase(session.loggedInUser.role, 'ADMIN')}" class="card shadow-sm mx-auto mb-5" style="max-width: 500px; border-radius: 15px;">
        <div class="card-body p-4">
            <h5 class="card-title text-success mb-4 fw-bold">🍔 Add New Food Item</h5>
            <form th:action="@{/shop/{id}/addItem(id=${shop.shop_id})}" method="post">
                <div class="mb-3">
                    <input type="text" name="name" class="form-control" placeholder="Food Name" required>
                </div>
                <div class="mb-3 d-flex align-items-center">
                    <span class="me-2 fw-bold text-muted">Rs.</span>
                    <input type="number" step="0.01" name="price" class="form-control" placeholder="Price" required>
                </div>
                <button type="submit" class="btn btn-success w-100 fw-bold">➕ Add Item</button>
            </form>
        </div>
    </div>

    <div class="card shadow-sm mx-auto mb-5" style="max-width: 600px; border-radius: 15px;">
        <div class="card-body p-4">
            <h4 class="mb-3 text-dark fw-bold border-bottom pb-2">Menu List</h4>

            <div th:if="${#lists.isEmpty(menuItems)}" class="alert alert-secondary">
                තාම මේ කඩේට කෑම ජාති ඇතුලත් කරලා නැහැ. 😕
            </div>

            <!-- Search Form එක -->
            <div class="container mt-4 mb-4">
                <form th:action="@{'/shop/' + ${shopId}}" method="get" class="d-flex">
                    <input class="form-control me-2" type="search" name="keyword" th:value="${keyword}"
                           placeholder="Search for food..." aria-label="Search">
                    <button class="btn btn-outline-success" type="submit">Search</button>

                    <!-- සර්ච් කරපු දේ ක්ලියර් කරන්න -->
                    <a th:href="@{'/shop/' + ${shopId}}" class="btn btn-outline-secondary ms-2">Clear</a>
                </form>
            </div>

            <div class="table-responsive" th:if="${!#lists.isEmpty(menuItems)}">
                <table class="table table-hover align-middle mt-3">
                    <thead class="table-warning">
                    <tr>
                        <th class="text-start ps-4">Food Item</th>
                        <th>Price</th>
                        <th class="text-center">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="item : ${menuItems}">
                        <td class="fw-bold text-start ps-4" th:text="${item.name}">Food Name</td>
                        <td th:text="'Rs. ' + ${item.price}">Price</td>

                        <td class="text-center">

                            <a th:if="${session.loggedInUser != null and !#strings.equalsIgnoreCase(session.loggedInUser.role, 'ADMIN')}"
                               th:href="@{/shop/{shopId}/item/{itemId}/addToCart(shopId=${shop.shop_id}, itemId=${item.item_id})}"
                               class="btn btn-primary btn-sm fw-bold">
                                🛒 Add to Cart
                            </a>

                            <a th:if="${session.loggedInUser != null and #strings.equalsIgnoreCase(session.loggedInUser.role, 'ADMIN')}"
                               th:href="@{/shop/{shopId}/item/delete/{itemId}(shopId=${shop.shop_id}, itemId=${item.item_id})}"
                               class="btn btn-outline-danger btn-sm fw-bold"
                               onclick="return confirm('මෙම කෑම වර්ගය මකා දැමීමට අවශ්‍යද?')">
                                🗑️ Delete
                            </a>

                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>

</body>
</html>
