<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - SABRA Eats</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center vh-100">
<div class="container">
    <div class="card shadow-sm mx-auto p-4" style="max-width: 400px; border-radius: 15px;">
        <h3 class="text-center text-warning fw-bold mb-4">🍔 Login</h3>

        <div th:if="${param.registered}" class="alert alert-success text-center">Account Created! Please Login.</div>
        <div th:if="${param.logout}" class="alert alert-info text-center">You have been logged out.</div>
        <div th:if="${error}" class="alert alert-danger text-center" th:text="${error}"></div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <input type="email" name="email" class="form-control" placeholder="Email Address" required>
            </div>
            <div class="mb-4">
                <input type="password" name="password" class="form-control" placeholder="Password" required>
            </div>
            <button type="submit" class="btn btn-warning w-100 fw-bold text-dark">Login</button>
        </form>
        <div class="text-center mt-3">
            <span class="text-muted">Don't have an account?</span>
            <a th:href="@{/register}" class="text-warning fw-bold text-decoration-none">Register</a>
        </div>
    </div>
</div>
</body>
</html>
